<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="profile-container">

        <h1>Edit Profile</h1>

        <form>

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="Toshy"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="toshy@gmail.com"
            >

            <label for="phone">Phone</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                value="01XXXXXXXXX"
            >

            <button type="submit">
                Update Profile
            </button>

        </form>

        <a href="view-profile.html">
            Back to Profile
        </a>

    </div>

</body>
</html>
